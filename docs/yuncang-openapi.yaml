openapi: 3.0.3
info:
  title: 云仓智配 V1.0 API
  version: 1.0.0
  description: |
    多仓库存与调拨协同平台接口最高契约。库存只通过业务单据动作变化；数量为整数；所有动作整单原子执行。业务详细规则见 V1.0-项目设计.md。
    所有接口的通用错误码包括 VALIDATION_ERROR(400)、UNAUTHENTICATED(401)、FORBIDDEN(403)、NOT_FOUND(404)。库存写入发生死锁或锁等待失败时返回可重试的 STOCK_BUSY(409)，整单事务回滚。
    Java 后端已实现本契约的全部 V1.0 接口；所有库存变更和流水、预警刷新在同一事务内完成。
servers:
- url: /api/v1
tags:
- name: 认证
- name: 仓库
- name: 分类
- name: SKU
- name: 库存
- name: 入库
- name: 出库
- name: 调拨
- name: 库存流水
- name: 盘点
- name: 库存预警
