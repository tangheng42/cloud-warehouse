spring:
  application:
    name: cloud-warehouse
  profiles:
    default: mysql
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    openfeign:
      client:
        config:
          yuncang-notification:
            connectTimeout: 1000
            readTimeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      notificationQuery:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

        # 限流异常不计入熔断统计
        ignoreExceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted

  ratelimiter:
    instances:
      notificationQueryLimiter:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0

  bulkhead:
    instances:
      notificationQueryBulkhead:
        maxConcurrentCalls: 2
        maxWaitDuration: 0

server:
  port: 8090

springdoc:
  swagger-ui:
    urls:
      - name: V1.0 最终接口契约
        url: /openapi/yuncang-openapi.json
      - name: 已实现接口（可调试）
        url: /v3/api-docs
    urls-primary-name: V1.0 最终接口契约

knife4j:
  setting:
    language: zh_cn

app:
  internal:
    token: ${APP_INTERNAL_TOKEN:}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    exchange: ${NOTIFICATIONS_EXCHANGE:yuncang.stock-alert}
    queue: ${NOTIFICATIONS_QUEUE:yuncang.stock-alert.notification}
    publish-interval-ms: ${NOTIFICATIONS_PUBLISH_INTERVAL_MS:5000}
  stock-cache:
    enabled: ${STOCK_CACHE_ENABLED:false}
    ttl: ${STOCK_CACHE_TTL:PT5M}
    jitter: ${STOCK_CACHE_JITTER:PT30S}
